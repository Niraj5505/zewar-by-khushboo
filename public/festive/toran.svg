<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Top Horizontal Hanging Cord -->
  <path d="M0 6 H160" stroke="#C6A15B" stroke-width="2" stroke-linecap="round"/>
  <!-- Draped Swags -->
  <path d="M0 6 Q40 38 80 6 Q120 38 160 6" stroke="#A8843F" stroke-width="1.2" fill="none"/>
  <path d="M0 6 Q40 52 80 6 Q120 52 160 6" stroke="#C6A15B" stroke-width="0.8" stroke-dasharray="2 2" fill="none"/>
  <!-- Hanging Mango Leaves & Marigold Motifs -->
  <!-- Left Drop -->
  <path d="M40 24 L40 68 Q40 82 35 92 Q40 82 45 68 L45 24 Z" fill="#2E5A36" fill-opacity="0.85" stroke="#C6A15B" stroke-width="0.8"/>
  <circle cx="40" cy="24" r="5" fill="#E8A33D"/>
  <circle cx="40" cy="98" r="3" fill="#C6A15B"/>
  <!-- Center Drop -->
  <path d="M80 6 L80 80 Q80 96 75 106 Q80 96 85 80 L85 6 Z" fill="#2E5A36" fill-opacity="0.85" stroke="#C6A15B" stroke-width="0.8"/>
  <circle cx="80" cy="20" r="6" fill="#E8A33D"/>
  <circle cx="80" cy="34" r="4" fill="#B33A2B"/>
  <circle cx="80" cy="112" r="3.5" fill="#C6A15B"/>
  <!-- Right Drop -->
  <path d="M120 24 L120 68 Q120 82 115 92 Q120 82 125 68 L125 24 Z" fill="#2E5A36" fill-opacity="0.85" stroke="#C6A15B" stroke-width="0.8"/>
  <circle cx="120" cy="24" r="5" fill="#E8A33D"/>
  <circle cx="120" cy="98" r="3" fill="#C6A15B"/>
  <!-- Little hanging gold bells/beads -->
  <circle cx="12" cy="16" r="2.5" fill="#C6A15B"/>
  <circle cx="148" cy="16" r="2.5" fill="#C6A15B"/>
</svg>
